[package]
name = "deploydesk"
version = "0.6.1"
description = "DeployDesk is a pure Rust desktop app for building, publishing, and rolling back web frontend releases over SSH/SFTP."
authors = ["DeployDesk contributors"]
license = "MIT"
edition = "2021"

[dependencies]
chrono = "0.4"
dirs = "6"
flate2 = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16.1"
ssh2 = "0.9"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.16.1"

[patch.crates-io]
parley = { path = "vendor/parley-0.8.0" }
